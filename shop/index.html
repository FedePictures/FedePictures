}

  return dictionary[key] || translations.it[key] || key;

/* ---------------------------------------------------------
   UTILITÀ CARRELLO
   --------------------------------------------------------- */

function writeCart(cart) {
  try {
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
    updateCartCount();
    return true;
  } catch (e) {
    toast(lang === 'it'
      ? 'Spazio del browser insufficiente. Prova un’immagine più piccola.'
      : 'Not enough browser storage. Try a smaller image.');
    return false;
  }
}

function updateCartCount() {
  const count = $('cart-count');
  if (!count) return;

  count.textContent = readCart().reduce(
    (total, item) => total + (Number(item.quantity) || 0),
    0
  );
}

function toast(message) {
  const element = $('toast');
  if (!element) return;

  element.textContent = message;
  element.classList.add('show');

  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => {
    element.classList.remove('show');
  }, 3500);
}

function cartIcon() {
  return '<svg viewBox="0 0 24 24" aria-hidden="true">' +
    '<path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h8.9a2 2 0 0 0 1.9-1.4L22 8H6"/>' +
    '<circle cx="10" cy="20" r="1"/><circle cx="18" cy="20" r="1"/>' +
    '</svg>';
}

document.querySelectorAll('.cart-icon-button').forEach(button => {
  button.innerHTML = cartIcon();
});

/* ---------------------------------------------------------
   PERSONALIZZAZIONI
   --------------------------------------------------------- */

function getSize(kind) {
  const radio = document.querySelector(
    'input[name="' + kind + '-size"]:checked'
  );

  return radio
    ? { value: radio.value, price: Number(radio.dataset.price) }
    : null;
}

function quantity(kind) {
  const field = $(products[kind].qty);
  if (!field || field.value.trim() === '') return 0;

  const number = Number(field.value);
  return Number.isFinite(number) ? number : 0;
}

function customizationReady(kind) {
  const customization = saved && saved[kind];
  if (!customization || typeof customization !== 'object') return false;

  const hasTheme = typeof customization.theme === 'string' &&
    customization.theme.trim().length > 0;

  const hasImage = typeof customization.fileData === 'string' &&
    customization.fileData.startsWith('data:image/');

  return hasTheme || hasImage;
}

function updateCustomButton(kind) {
  const product = products[kind];
  const button = document.querySelector('[data-add-custom="' + kind + '"]');

  if (!product || !button) return;

  const qty = quantity(kind);
  const qtyOk = Number.isInteger(qty) && qty > 0;
  const sizeOk = !product.size || Boolean(getSize(kind));
  const shirtOk = kind !== 'shirt' ||
    Boolean($('shirt-size') && $('shirt-size').value.trim());
  const customOk = customizationReady(kind);

  const enabled = qtyOk && sizeOk && shirtOk && customOk;

  button.disabled = !enabled;
  button.setAttribute('aria-disabled', String(!enabled));
}

function showSavedCustomization(kind) {
  const product = products[kind];
  if (!product) return;

  const state = $(product.state);
  if (!state) return;

  if (!customizationReady(kind)) {
    state.textContent = '';
    return;
  }

  const customization = saved[kind];

  if ((customization.fileData || '').startsWith('data:image/')) {
    state.textContent = (lang === 'it' ? 'Immagine selezionata: ' : 'Image selected: ') +
      (customization.fileName || '');
  } else {
    state.textContent = (lang === 'it' ? 'Tema: ' : 'Theme: ') +
      (customization.theme || '');
  }
}

function renderSavedPreview(kind) {
  const box = $('saved-custom-preview');
  if (!box) return;

  box.innerHTML = '';
  const customization = saved[kind];

  if (!customizationReady(kind)) {
    box.hidden = true;
    return;
  }

  box.hidden = false;

  if ((customization.fileData || '').startsWith('data:image/')) {
    const row = document.createElement('div');
    row.className = 'saved-preview-item';

    const image = document.createElement('img');
    image.src = customization.fileData;
    image.alt = lang === 'it' ? 'Immagine già salvata' : 'Saved image';

    const caption = document.createElement('p');
    caption.textContent = (lang === 'it' ? 'Immagine già salvata: ' : 'Saved image: ') +
      (customization.fileName || 'immagine');

    row.append(image, caption);
    box.appendChild(row);
  } else {
    const theme = document.createElement('p');
    theme.className = 'saved-theme-preview';
    theme.textContent = (lang === 'it' ? 'Tema già salvato: ' : 'Saved theme: ') +
      (customization.theme || '');
    box.appendChild(theme);
  }
}

/* ---------------------------------------------------------
   FINESTRA DI UPLOAD
   --------------------------------------------------------- */

function openModal(kind) {
  if (!products[kind]) return;

  activeKind = kind;
  pendingFileData = null;
  fileReading = false;

  $('reference-file').value = '';
  $('reference-theme').value = '';
  $('modal-error').textContent = '';

  const existing = saved[kind];
  const hasSaved = customizationReady(kind);

  $('existing-custom-note').textContent = hasSaved
    ? (lang === 'it'
        ? 'Personalizzazione già salvata. Puoi mantenerla oppure sostituirla.'
        : 'Customization already saved. Keep it or replace it.')
    : '';

  if (existing && existing.theme) {
    $('reference-theme').value = existing.theme;
  }

  $('modal-title').textContent = t('modalTitle') + ': ' +
    products[kind].name[lang];

  $('modal-instructions').textContent = t('instructions');
  $('upload-label').textContent = t('upload');
  $('upload-note').textContent = t('uploadNote');
  $('or-label').textContent = t('or');
  $('theme-label').textContent = t('theme');
  $('reference-theme').placeholder = t('themePlaceholder');
  $('cancel-custom').textContent = t('cancel');
  $('confirm-custom').textContent = t('confirm');

  renderSavedPreview(kind);

  $('custom-modal').classList.add('open');
}

function closeModal() {
  $('custom-modal').classList.remove('open');
  activeKind = null;
  pendingFileData = null;
  fileReading = false;
}

/* Delega del click: i pulsanti restano attivi anche se il DOM cambia. */
document.addEventListener('click', event => {
  const button = event.target.closest('[data-customize]');
  if (!button) return;

  event.preventDefault();
  openModal(button.dataset.customize);
});

$('cancel-custom').addEventListener('click', closeModal);

$('custom-modal').addEventListener('click', event => {
  if (event.target === $('custom-modal')) closeModal();
});

/* Caricamento immagine */
$('reference-file').addEventListener('change', () => {
  const file = $('reference-file').files[0];

  pendingFileData = null;
  fileReading = false;
  $('modal-error').textContent = '';

  if (!file) return;

  $('reference-theme').value = '';

  if (!file.type.startsWith('image/')) {
    $('modal-error').textContent = t('fileType');
    $('reference-file').value = '';
    return;
  }

  if (file.size > MAX_FILE_BYTES) {
    $('modal-error').textContent = t('fileLarge');
    $('reference-file').value = '';
    return;
  }

  fileReading = true;
  $('confirm-custom').disabled = true;

  const reader = new FileReader();

  reader.onload = () => {
    pendingFileData = {
      name: file.name,
      type: file.type,
      data: reader.result
    };

    fileReading = false;
    $('confirm-custom').disabled = false;
  };

  reader.onerror = () => {
    fileReading = false;
    $('confirm-custom').disabled = false;
    $('modal-error').textContent = lang === 'it'
      ? 'Impossibile leggere il file. Riprova.'
      : 'Unable to read the file. Please try again.';
  };

  reader.readAsDataURL(file);
});

/* Se si digita un tema, si cancella l'eventuale file appena scelto. */
$('reference-theme').addEventListener('input', () => {
  $('modal-error').textContent = '';

  if ($('reference-theme').value.trim()) {
    $('reference-file').value = '';
    pendingFileData = null;
    fileReading = false;
    $('confirm-custom').disabled = false;
  }
});

/* Rimuovi personalizzazione salvata o nuova selezione */
$('remove-saved-custom').addEventListener('click', () => {
  if (!activeKind) return;

  delete saved[activeKind];

  $('reference-file').value = '';
  $('reference-theme').value = '';
  pendingFileData = null;
  fileReading = false;
  $('confirm-custom').disabled = false;
  $('existing-custom-note').textContent = '';
  $('modal-error').textContent = '';

  try {
    localStorage.setItem(CUSTOM_KEY, JSON.stringify(saved));
  } catch (e) {}

  renderSavedPreview(activeKind);
  showSavedCustomization(activeKind);
  updateCustomButton(activeKind);
});

/* Conferma tema o immagine */
$('custom-form').addEventListener('submit', event => {
  event.preventDefault();

  if (!activeKind) return;

  if (fileReading) {
    $('modal-error').textContent = lang === 'it'
      ? 'Attendi che il caricamento dell’immagine sia terminato.'
      : 'Wait until the image upload has finished.';
    return;
  }

  const kind = activeKind;
  const theme = $('reference-theme').value.trim();

  if (pendingFileData && theme) {
    $('modal-error').textContent = t('needOne');
    return;
  }

  if (pendingFileData) {
    saved[kind] = {
      theme: '',
      fileName: pendingFileData.name,
      fileType: pendingFileData.type,
      fileData: pendingFileData.data
    };
  } else if (theme) {
    saved[kind] = {
      theme: theme,
      fileName: '',
      fileType: '',
      fileData: ''
    };
  } else if (!customizationReady(kind)) {
    $('modal-error').textContent = t('needOne');
    return;
  }

  try {
    localStorage.setItem(CUSTOM_KEY, JSON.stringify(saved));
  } catch (error) {
    $('modal-error').textContent = lang === 'it'
      ? 'Immagine troppo grande per la memoria del browser. Prova un file più piccolo.'
      : 'Image too large for browser storage. Try a smaller file.';
    return;
  }

  showSavedCustomization(kind);
  closeModal();
  updateCustomButton(kind);
});

/* ---------------------------------------------------------
   AGGIUNTA PRODOTTI PERSONALIZZATI AL CARRELLO
   --------------------------------------------------------- */

document.querySelectorAll('[data-add-custom]').forEach(button => {
  button.addEventListener('click', () => {
    const kind = button.dataset.addCustom;
    const qty = quantity(kind);

    if (!Number.isInteger(qty) || qty < 1) {
      toast(t('needQty'));
      updateCustomButton(kind);
      return;
    }

    if (!customizationReady(kind)) {
      toast(t('needCustom'));
      updateCustomButton(kind);
      return;
    }

    const size = getSize(kind);

    if (products[kind].size && !size) {
      toast(t('needSize'));
      updateCustomButton(kind);
      return;
    }

    if (kind === 'shirt' && !$('shirt-size').value.trim()) {
      toast(t('needShirtSize'));
      updateCustomButton(kind);
      return;
    }

    /* Prezzi prodotti personalizzati */
    const price = size
      ? size.price
      : kind === 'shirt'
        ? 20
        : kind === 'mini-canvas'
          ? 8
          : null;

    const customization = saved[kind];

    const item = {
      id: 'custom-' + kind + '-' + Date.now(),
      type: 'custom',
      kind: kind,
      name: products[kind].name[lang],
      quantity: qty,
      unitPrice: price,
      pricePending: price === null,
      size: size ? size.value : '',
      shirtSize: kind === 'shirt' ? $('shirt-size').value.trim() : '',
      backText: (kind === 'bookmark' || kind === 'bauble')
        ? $(kind + '-back-text').value.trim()
        : '',
      customization: {
        theme: customization.theme || '',
        fileName: customization.fileName || '',
        fileType: customization.fileType || '',
        fileData: customization.fileData || ''
      }
    };

    const oldCustomization = customization;
    const cart = readCart();
    cart.push(item);

    /* Pulisci la personalizzazione temporanea per l'ordine successivo. */
    delete saved[kind];

    try {
      localStorage.setItem(CUSTOM_KEY, JSON.stringify(saved));
    } catch (error) {
      saved[kind] = oldCustomization;
      toast(lang === 'it'
        ? 'Impossibile salvare la modifica. Riprova.'
        : 'Unable to save changes. Please try again.');
      updateCustomButton(kind);
      return;
    }

    if (writeCart(cart)) {
      $(products[kind].qty).value = 0;

      if (kind === 'shirt') {
        $('shirt-size').value = '';
      }

      if (kind === 'bookmark' || kind === 'bauble') {
        document.querySelectorAll('input[name="' + kind + '-size"]').forEach(radio => {
          radio.checked = false;
        });

        $(kind + '-back-text').value = '';
      }

      showSavedCustomization(kind);
      updateCustomButton(kind);
      toast(t('added'));
    } else {
      saved[kind] = oldCustomization;

      try {
        localStorage.setItem(CUSTOM_KEY, JSON.stringify(saved));
      } catch (e) {}

      showSavedCustomization(kind);
      updateCustomButton(kind);
    }
  });
});

/* ---------------------------------------------------------
   RENDER DEI PRODOTTI IN PRONTA CONSEGNA
   --------------------------------------------------------- */

function renderReadyProducts() {
  const grid = $('ready-grid');
  const empty = $('ready-empty');

  if (!grid || !empty) return;

  grid.innerHTML = '';

  const filter = $('ready-filter') ? $('ready-filter').value : 'all';
  const sort = $('ready-sort') ? $('ready-sort').value : 'default';

  const filtered = readyProducts
    .map((product, index) => ({ product, index }))
    .filter(entry => {
      return filter === 'all' || entry.product.category === filter;
    });

  if (sort === 'price-asc') {
    filtered.sort((a, b) =>
      a.product.price - b.product.price || a.index - b.index
    );
  } else if (sort === 'price-desc') {
    filtered.sort((a, b) =>
      b.product.price - a.product.price || a.index - b.index
    );
  }

  empty.hidden = filtered.length > 0;
  empty.textContent = t('emptyCategory');

  filtered.forEach(entry => {
    const product = entry.product;
    const card = document.createElement('article');
    card.className = 'ready-card';

    const photo = document.createElement('button');
    photo.type = 'button';
    photo.className = 'ready-photo';
    photo.setAttribute('aria-label', t('photo') + ': ' + product[lang]);

    const image = document.createElement('img');
    image.src = product.image;
    image.alt = product[lang];
    image.loading = 'lazy';

    image.onerror = () => {
      image.style.display = 'none';
      photo.textContent = lang === 'it'
        ? 'Immagine non trovata: controlla il nome del file'
        : 'Image not found: check the filename';
      photo.style.fontSize = '.8rem';
    };

    photo.appendChild(image);

    /* Ingrandimento foto */
    photo.addEventListener('click', () => {
      if (image.style.display === 'none') return;

      const overlay = document.createElement('div');
      overlay.style.cssText =
        'position:fixed;inset:0;z-index:2500;background:#000d;' +
        'display:flex;align-items:center;justify-content:center;' +
        'padding:20px;cursor:zoom-out';

      const largeImage = document.createElement('img');
      largeImage.src = product.image;
      largeImage.alt = product[lang];
      largeImage.style.cssText =
        'max-width:95vw;max-height:90vh;object-fit:contain';

      overlay.appendChild(largeImage);
      overlay.addEventListener('click', () => overlay.remove());
      document.body.appendChild(overlay);
    });

    const description = document.createElement('p');
    description.className = 'ready-description';
    description.textContent = product[lang];

    const row = document.createElement('div');
    row.className = 'ready-buy-row';

    const price = document.createElement('span');
    price.className = 'ready-price';
    price.textContent = new Intl.NumberFormat(
      lang === 'it' ? 'it-IT' : 'en-GB',
      { style: 'currency', currency: 'EUR' }
    ).format(product.price);

    const label = document.createElement('span');
    label.className = 'add-label';
    label.textContent = t('add');

    const add = document.createElement('button');
    add.className = 'cart-icon-button';
    add.type = 'button';
    add.innerHTML = cartIcon();
    add.setAttribute('aria-label', t('add'));

    add.addEventListener('click', () => {
      const cart = readCart();

      cart.push({
        id: product.id,
        type: 'ready',
        name: product[lang],
        image: product.image,
        quantity: 1,
        unitPrice: product.price
      });

      if (writeCart(cart)) {
        toast(t('added'));
      }
    });

    row.append(price, label, add);
    card.append(photo, description, row);
    grid.appendChild(card);
  });
}

/* ---------------------------------------------------------
   TRADUZIONE PAGINA
   --------------------------------------------------------- */

function applyLanguage() {
  document.documentElement.lang = lang;

  const map = {
    'cart-label': 'cart',
    'explore-button': 'explore',
    'menu-home': 'home',
    'menu-portraits': 'portraits',
    'menu-digital': 'digital',
    'menu-wall': 'wall',
    'menu-bookmarks': 'bookmarks',
    'menu-balls': 'balls',
    'menu-shirts': 'shirts',
    'menu-contact': 'contact',

    'page-title': 'title',
    'page-intro': 'intro',
    'custom-heading': 'customHeading',
    'ready-heading': 'readyHeading',

    'bookmark-title': 'bookmark',
    'bauble-title': 'bauble',
    'shirt-title': 'shirt',
    'canvas-title': 'canvas',
    'other-title': 'other',

    'bookmark-small': 'bookmarkSmall',
    'bookmark-large': 'bookmarkLarge',
    'bauble-small': 'baubleSmall',
    'bauble-large': 'baubleLarge',

    'bookmark-description': 'bookmarkDesc',
    'bauble-description': 'bookmarkDesc',
    'shirt-size-label': 'shirtSize',
    'shirt-description': 'shirtDesc',
    'canvas-description': 'canvasDesc',
    'other-description': 'otherDesc',

    'contact-button': 'contactButton',
    'contact-heading': 'contactHeading',
    'contact-copy': 'contactCopy',
    'contact-cta': 'contactCta'
  };

  Object.entries(map).forEach(([id, key]) => {
    const element = $(id);
    if (element) element.textContent = t(key);
  });

  const readyMap = {
    'ready-filter-label': 'readyFilter',
    'filter-all': 'allCategories',
    'filter-bookmarks': 'bookmarksCategory',
    'filter-canvases': 'canvasesCategory',
    'filter-baubles': 'baublesCategory',
    'filter-accessories': 'accessoriesCategory',
    'filter-objects': 'objectsCategory',
    'ready-sort-label': 'sortPrice',
    'sort-default': 'sortDefault',
    'sort-asc': 'sortAsc',
    'sort-desc': 'sortDesc'
  };

  Object.entries(readyMap).forEach(([id, key]) => {
    const element = $(id);
    if (element) element.textContent = t(key);
  });

  if ($('shirt-size')) {
    $('shirt-size').placeholder = t('shirtPlaceholder');
  }

  if ($('reference-theme')) {
    $('reference-theme').placeholder = t('themePlaceholder');
  }

  if ($('language-button')) {
    $('language-button').textContent = lang === 'it' ? 'EN' : 'IT';
  }

  document.querySelectorAll('.quantity-label').forEach(element => {
    element.textContent = t('qty');
  });

  document.querySelectorAll('[data-customize]').forEach(element => {
    element.textContent = t('customize');
  });

  document.querySelectorAll('.back-text-input').forEach(element => {
    element.placeholder = lang === 'it' ? 'Scrivi...' : 'Write here...';
  });

  document.querySelectorAll('[data-add-custom]').forEach(button => {
    button.setAttribute(
      'aria-label',
      lang === 'it' ? 'Aggiungi al carrello' : 'Add to cart'
    );
  });

  Object.keys(products).forEach(kind => {
    showSavedCustomization(kind);
    updateCustomButton(kind);
  });

  renderReadyProducts();
}

/* ---------------------------------------------------------
   EVENTI FILTRI, MENU, LINGUA E CAMPI
   --------------------------------------------------------- */

if ($('ready-filter')) {
  $('ready-filter').addEventListener('change', renderReadyProducts);
}

if ($('ready-sort')) {
  $('ready-sort').addEventListener('change', renderReadyProducts);
}

if ($('language-button')) {
  $('language-button').addEventListener('click', () => {
    lang = lang === 'it' ? 'en' : 'it';

    try {
      localStorage.setItem(LANG_KEY, lang);
    } catch (e) {}

    applyLanguage();
  });
}

if ($('explore-button')) {
  $('explore-button').addEventListener('click', () => {
    const menu = $('explore-menu');
    if (!menu) return;

    menu.classList.toggle('show');

    $('explore-button').setAttribute(
      'aria-expanded',
      menu.classList.contains('show') ? 'true' : 'false'
    );
  });
}

document.addEventListener('click', event => {
  if (!event.target.closest('.dropdown')) {
    const menu = $('explore-menu');
    if (menu) menu.classList.remove('show');

    if ($('explore-button')) {
      $('explore-button').setAttribute('aria-expanded', 'false');
    }
  }
});

document.addEventListener('input', event => {
  if (event.target.matches('.quantity-row input, .size-input, .back-text-input')) {
    Object.keys(products).forEach(updateCustomButton);
  }
});

document.addEventListener('change', event => {
  if (event.target.matches('.quantity-row input, .size-input, input[type="radio"][name$="-size"]')) {
    Object.keys(products).forEach(updateCustomButton);
  }
});

/* ---------------------------------------------------------
   AVVIO PAGINA
   Carica i prodotti pronti prima delle traduzioni così la
   griglia non resta vuota se un testo dà un errore.
   --------------------------------------------------------- */

try {
  updateCartCount();
} catch (e) {
  console.error('Errore aggiornamento carrello:', e);
}

Object.keys(products).forEach(kind => {
  try {
    showSavedCustomization(kind);
    updateCustomButton(kind);
  } catch (e) {
    console.warn('Personalizzazione ignorata temporaneamente:', kind, e);
  }
});

/* Primo rendering indipendente della griglia */
try {
  renderReadyProducts();
} catch (e) {
  console.error('Errore nel rendering dei prodotti pronti:', e);
}

/* Poi applica lingua e testi */
try {
  applyLanguage();
} catch (e) {
  console.error('Errore nell’applicazione della lingua:', e);

  /* Un errore di traduzione non deve nascondere i prodotti pronti. */
  try {
    renderReadyProducts();
  } catch (renderError) {
    console.error('Impossibile mostrare la griglia prodotti:', renderError);
  }
}
</script>
